<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - QL Phòng Trọ' : 'QL Phòng Trọ'}">QL Phòng Trọ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sw: 260px; --accent: #6366f1; }
        * { font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; }
        #sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: var(--sw);
            background: #0f172a; z-index: 1000; overflow-y: auto;
            display: flex; flex-direction: column; transition: transform .3s;
        }
        .sb-brand { display:flex; align-items:center; gap:10px; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,.08); }
        .sb-logo { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#8b5cf6); display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff; flex-shrink:0; }
        .sb-title { color:#f1f5f9; font-weight:700; font-size:.9rem; }
        .sb-sub { color:#94a3b8; font-size:.68rem; }
        .sb-section { padding:12px 12px 2px; color:#475569; font-size:.62rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
        .sb-link { display:flex; align-items:center; gap:9px; padding:8px 14px; margin:1px 8px; border-radius:8px; color:#94a3b8; text-decoration:none; font-size:.83rem; font-weight:500; transition:all .14s; }
        .sb-link:hover { background:#1e293b; color:#e2e8f0; }
        .sb-link.active { background:#6366f1; color:#fff; }
        .sb-link .bi { font-size:.9rem; flex-shrink:0; }
        #main { margin-left:var(--sw); min-height:100vh; display:flex; flex-direction:column; }
        .topbar { position:sticky; top:0; z-index:900; height:58px; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; padding:0 22px; gap:12px; }
        .content { padding:22px; flex:1; }
        .stat-card { background:#fff; border-radius:14px; padding:20px; border:1px solid #e2e8f0; transition:transform .2s,box-shadow .2s; }
        .stat-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.08); }
        .stat-icon { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:12px; }
        .stat-val { font-size:1.65rem; font-weight:700; color:#1e293b; }
        .stat-lbl { color:#64748b; font-size:.78rem; margin-top:2px; }
        .card-box { background:#fff; border-radius:14px; border:1px solid #e2e8f0; overflow:hidden; }
        .card-box-hd { padding:14px 18px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; justify-content:space-between; }
        .card-box-hd h5 { margin:0; font-weight:600; color:#1e293b; font-size:.9rem; }
        .table { margin:0; }
        .table th { background:#f8fafc; font-size:.72rem; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.05em; border-top:none; padding:10px 14px; }
        .table td { padding:12px 14px; vertical-align:middle; font-size:.855rem; color:#374151; }
        .table tbody tr:hover { background:#f8fafc; }
        .badge { font-size:.72rem; padding:4px 9px; border-radius:6px; font-weight:500; }
        .bg-trang { background:#d1fae5!important; color:#065f46!important; }
        .bg-dang-thue { background:#dbeafe!important; color:#1e40af!important; }
        .bg-ngung { background:#fce7f3!important; color:#9d174d!important; }
        .bg-active { background:#d1fae5!important; color:#065f46!important; }
        .bg-chua-tt { background:#fef9c3!important; color:#854d0e!important; }
        .bg-cho-duyet { background:#dbeafe!important; color:#1e40af!important; }
        .bg-da-tt { background:#d1fae5!important; color:#065f46!important; }
        .bg-moi { background:#fce7f3!important; color:#9d174d!important; }
        .bg-dang-xl { background:#fef3c7!important; color:#92400e!important; }
        .btn-accent { background:#6366f1; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:.84rem; font-weight:500; transition:all .15s; }
        .btn-accent:hover { background:#4f46e5; color:#fff; transform:translateY(-1px); }
        .form-control, .form-select { border:1.5px solid #e2e8f0; border-radius:9px; font-size:.875rem; padding:9px 12px; }
        .form-control:focus, .form-select:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
        .alert-flash { border-radius:10px; border:none; font-size:.86rem; }
        .page-title { font-size:1.2rem; font-weight:700; color:#1e293b; margin-bottom:16px; }
        @media (max-width:768px) { #sidebar { transform:translateX(-100%); } #sidebar.open { transform:translateX(0); } #main { margin-left:0; } }
    </style>
</head>
<body>

<nav id="sidebar">
    <div>
        <div class="sb-brand">
            <div class="sb-logo"><i class="bi bi-house-fill"></i></div>
            <div><div class="sb-title">QL Phòng Trọ</div><div class="sb-sub" sec:authentication="name">user</div></div>
        </div>
        <div sec:authorize="hasRole('LANDLORD')">
            <div class="sb-section">Tổng quan</div>
            <a th:href="@{/landlord/dashboard}" class="sb-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
            <div class="sb-section">Quản lý</div>
            <a th:href="@{/landlord/toa-nha}" class="sb-link"><i class="bi bi-building"></i>Tòa nhà</a>
            <a th:href="@{/landlord/phong}" class="sb-link"><i class="bi bi-door-open"></i>Phòng</a>
            <a th:href="@{/landlord/thiet-bi}" class="sb-link"><i class="bi bi-plug"></i>Thiết bị</a>
            <a th:href="@{/landlord/khach-thue}" class="sb-link"><i class="bi bi-people"></i>Khách thuê</a>
            <a th:href="@{/landlord/hop-dong}" class="sb-link"><i class="bi bi-file-earmark-text"></i>Hợp đồng</a>
            <div class="sb-section">Tài chính</div>
            <a th:href="@{/landlord/chi-so}" class="sb-link"><i class="bi bi-lightning-charge"></i>Điện / Nước</a>
            <a th:href="@{/landlord/hoa-don}" class="sb-link"><i class="bi bi-receipt"></i>Hóa đơn</a>
            <a th:href="@{/landlord/bang-gia}" class="sb-link"><i class="bi bi-currency-dollar"></i>Bảng giá</a>
            <a th:href="@{/landlord/phi-dich-vu}" class="sb-link"><i class="bi bi-collection"></i>Phí dịch vụ</a>
            <div class="sb-section">Khác</div>
            <a th:href="@{/landlord/boi-thuong}" class="sb-link"><i class="bi bi-shield-exclamation"></i>Bồi thường</a>
            <a th:href="@{/landlord/su-co}" class="sb-link"><i class="bi bi-tools"></i>Sự cố</a>
            <a th:href="@{/landlord/nguoi-dung}" class="sb-link"><i class="bi bi-person-gear"></i>Tài khoản</a>
        </div>
        <div sec:authorize="hasRole('TENANT')">
            <div class="sb-section">Của tôi</div>
            <a th:href="@{/tenant/dashboard}" class="sb-link"><i class="bi bi-house"></i>Trang chủ</a>
            <a th:href="@{/tenant/hop-dong}" class="sb-link"><i class="bi bi-file-earmark-text"></i>Hợp đồng</a>
            <a th:href="@{/tenant/hoa-don}" class="sb-link"><i class="bi bi-receipt"></i>Hóa đơn</a>
            <a th:href="@{/tenant/chi-so}" class="sb-link"><i class="bi bi-lightning-charge"></i>Điện / Nước</a>
            <a th:href="@{/tenant/boi-thuong}" class="sb-link"><i class="bi bi-shield-exclamation"></i>Bồi thường</a>
            <a th:href="@{/tenant/su-co}" class="sb-link"><i class="bi bi-tools"></i>Báo sự cố</a>
        </div>
    </div>
    <div style="padding:10px 8px; border-top:1px solid rgba(255,255,255,.06); margin-top:auto;">
        <a th:href="@{/doi-mat-khau}" class="sb-link mb-1"><i class="bi bi-key"></i>Đổi mật khẩu</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="sb-link w-100 border-0 text-start" style="background:transparent;cursor:pointer;">
                <i class="bi bi-box-arrow-right"></i>Đăng xuất
            </button>
        </form>
    </div>
</nav>

<div id="main">
    <div class="topbar">
        <button class="btn btn-sm btn-light d-md-none" onclick="document.getElementById('sidebar').classList.toggle('open')">
            <i class="bi bi-list"></i>
        </button>
        <span style="font-weight:600;color:#1e293b;font-size:.92rem" th:text="${pageTitle}">Trang</span>
        <div class="ms-auto d-flex align-items-center gap-2">
            <i class="bi bi-person-circle" style="color:#6366f1;font-size:1.15rem"></i>
            <small class="text-muted" sec:authentication="name">user</small>
        </div>
    </div>
    <div class="content">
        <div th:if="${successMsg}" class="alert alert-success alert-flash alert-dismissible fade show mb-3">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-flash alert-dismissible fade show mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Chèn fragment "content" của view con dựa vào tên file truyền trong pageContent -->
        <div th:if="${pageContent != null}" th:insert="~{${pageContent} :: content}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
