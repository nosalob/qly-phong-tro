
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Hóa đơn</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Quản lý Hóa đơn</h1>
        <button type="button" class="btn btn-accent"
                data-bs-toggle="modal" data-bs-target="#modalTaoHoaDon">
            <i class="bi bi-plus-circle me-1"></i>Tạo hóa đơn
        </button>
    </div>

    <!-- Form lọc hóa đơn -->
    <form th:action="@{/landlord/hoa-don}" method="get" class="card-box mb-3">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Tòa nhà</label>
                <select name="toaNhaId" id="filterToaNha" class="form-select">
                    <option value="">Tất cả tòa nhà</option>
                    <option th:each="toa : ${danhSachToaNha}"
                            th:value="${toa.id}"
                            th:text="${toa.tenToaNha}"
                            th:selected="${toaNhaId != null and toaNhaId == toa.id}">
                    </option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Phòng</label>
                <select name="phongId" id="filterPhong" class="form-select">
                    <option value="">Tất cả phòng</option>
                    <option th:each="phong : ${danhSachPhong}"
                            th:value="${phong.id}"
                            th:text="${phong.soPhong + ' - ' + phong.tenToaNha}"
                            th:attr="data-toanha=${phong.toaNhaId}"
                            th:selected="${phongId != null and phongId == phong.id}">
                    </option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Từ tháng</label>
                <input type="month" name="tuThang" class="form-control"
                       th:value="${tuThang}">
            </div>

            <div class="col-md-3">
                <label class="form-label">Đến tháng</label>
                <input type="month" name="denThang" class="form-control"
                       th:value="${denThang}">
            </div>

            <div class="col-md-4">
                <label class="form-label">Trạng thái</label>
                <select name="trangThai" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="CHO_DUYET"
                            th:selected="${trangThai == 'CHO_DUYET'}">
                        Chờ duyệt
                    </option>
                    <option value="CHUA_THANH_TOAN"
                            th:selected="${trangThai == 'CHUA_THANH_TOAN'}">
                        Chưa thanh toán
                    </option>
                    <option value="DA_THANH_TOAN"
                            th:selected="${trangThai == 'DA_THANH_TOAN'}">
                        Đã thanh toán
                    </option>
                </select>
            </div>

            <div class="col-md-8 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-accent">
                    <i class="bi bi-funnel me-1"></i>Lọc
                </button>
                <a th:href="@{/landlord/hoa-don}"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Xóa bộ lọc
                </a>
            </div>
        </div>
    </form>

    <!-- Danh sách hóa đơn -->
    <div class="card-box">
        <div class="card-box-hd">
            <h5>
                <i class="bi bi-receipt me-2" style="color:#6366f1"></i>
                Tất cả hóa đơn
            </h5>
            <small class="text-muted"
                   th:text="${danhSach != null ? danhSach.size() : 0} + ' hóa đơn'">
            </small>
        </div>

        <div th:if="${danhSach == null or danhSach.isEmpty()}"
             class="p-5 text-center text-muted">
            <i class="bi bi-receipt" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Chưa có hóa đơn nào.</p>
        </div>

        <div class="table-responsive"
             th:if="${danhSach != null and !danhSach.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Phòng</th>
                    <th>Khách đại diện</th>
                    <th>Tháng</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item, st : ${danhSach}">
                    <td th:text="${st.count}" class="text-muted"></td>

                    <td>
                        <strong th:text="${item.soPhong}"></strong>
                        <div class="text-muted"
                             style="font-size:.76rem"
                             th:text="${item.tenToaNha}">
                        </div>
                    </td>

                    <td th:text="${item.tenKhachDaiDien ?: '—'}"></td>

                    <td th:text="${item.thangNam}"></td>

                    <td class="fw-600 text-success"
                        th:text="${#numbers.formatDecimal(item.tongTien,0,'COMMA',0,'POINT')} + ' đ'">
                    </td>

                    <td>
                        <span class="badge"
                              th:classappend="${item.trangThai != null and item.trangThai.name() == 'CHUA_THANH_TOAN'} ? 'bg-chua-tt' :
                                  (${item.trangThai != null and item.trangThai.name() == 'CHO_DUYET'} ? 'bg-cho-duyet' : 'bg-da-tt')"
                              th:text="${item.trangThaiLabel}">
                        </span>
                    </td>

                    <td class="d-flex gap-1">
                        <a th:href="@{/landlord/hoa-don/{id}(id=${item.id})}"
                           class="btn btn-sm btn-outline-primary"
                           style="border-radius:7px;">
                            <i class="bi bi-eye"></i>
                        </a>

                        <form th:if="${item.trangThai != null and item.trangThai.name() == 'CHO_DUYET'}"
                              th:action="@{/landlord/hoa-don/{id}/xac-nhan(id=${item.id})}"
                              method="post">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="btn btn-sm btn-success"
                                    style="border-radius:7px;"
                                    title="Xác nhận thanh toán">
                                <i class="bi bi-check-circle"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal tạo hóa đơn -->
    <div class="modal fade" id="modalTaoHoaDon" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/landlord/hoa-don/tao}" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-receipt me-1"
                               style="color:#6366f1;"></i>
                            Tạo hóa đơn thanh toán
                        </h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-500">
                                Hợp đồng / Phòng thuê
                                <span class="text-danger">*</span>
                            </label>

                            <select name="hopDongId" class="form-select" required>
                                <option value="">-- Chọn hợp đồng / phòng --</option>
                                <option th:each="hd : ${danhSachHopDong}"
                                        th:value="${hd.id}"
                                        th:text="'HĐ #' + ${hd.id} + ' - Phòng ' + ${hd.soPhong} + ' (' + ${hd.tenToaNha} + ')' + (${hd.daiDien != null} ? ' - ' + ${hd.daiDien.hoTen} : '')">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-500">
                                Tháng lập hóa đơn
                                <span class="text-danger">*</span>
                            </label>

                            <input type="month" name="thangNam"
                                   class="form-control"
                                   th:value="${thangHienTai}" required>

                            <div class="form-text text-muted"
                                 style="font-size:.78rem;">
                                Lưu ý: Nếu là kỳ tiếp theo, phòng cần có chỉ số
                                điện nước tháng trước đã chốt.
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Hủy
                        </button>
                        <button type="submit" class="btn btn-accent">
                            <i class="bi bi-check-lg me-1"></i>Tạo hóa đơn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Lọc danh sách phòng theo tòa nhà -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toaNhaSelect = document.getElementById('filterToaNha');
            const phongSelect = document.getElementById('filterPhong');

            if (!toaNhaSelect || !phongSelect) {
                return;
            }

            function locPhong() {
                const toaNhaId = toaNhaSelect.value;

                Array.from(phongSelect.options).forEach(function (option) {
                    if (!option.value) {
                        option.hidden = false;
                        option.disabled = false;
                        return;
                    }

                    const cungToaNha =
                        !toaNhaId || option.dataset.toanha === toaNhaId;

                    option.hidden = !cungToaNha;
                    option.disabled = !cungToaNha;
                });

                const phongHienTai =
                    phongSelect.options[phongSelect.selectedIndex];

                if (phongHienTai && phongHienTai.hidden) {
                    phongSelect.value = '';
                }
            }

            toaNhaSelect.addEventListener('change', locPhong);
            locPhong();
        });
    </script>
</div>
</body>
</html>
