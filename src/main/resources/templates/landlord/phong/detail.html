<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Chi tiết Phòng</title></head>
<body>
<div th:fragment="content">

    <!-- Header -->
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/phong}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="page-title mb-0">
            Chi tiết Phòng <span th:text="${phong.soPhong}" style="color:#6366f1"></span>
            <small class="text-muted fw-normal" style="font-size:.8rem;" th:text="' — ' + ${phong.tenToaNha}"></small>
        </h1>
        <span class="badge ms-1"
              th:classappend="${phong.trangThai != null and phong.trangThai.name() == 'TRONG'} ? 'bg-trang' :
                             (${phong.trangThai != null and phong.trangThai.name() == 'DANG_THUE'} ? 'bg-dang-thue' : 'bg-ngung')"
              th:text="${phong.trangThaiLabel}"></span>
        <a th:href="@{/landlord/phong/sua/{id}(id=${phong.id})}"
           class="btn btn-sm btn-outline-primary ms-auto" style="border-radius:8px;">
            <i class="bi bi-pencil me-1"></i>Sửa phòng
        </a>
    </div>

    <div class="row g-3">
        <!-- Thong tin phong -->
        <div class="col-md-5">
            <div class="card-box h-100">
                <div class="card-box-hd">
                    <h5><i class="bi bi-door-open me-2" style="color:#6366f1"></i>Thông tin phòng</h5>
                </div>
                <div class="p-3">
                    <table class="table table-borderless mb-0" style="font-size:.875rem;">
                        <tr>
                            <td class="text-muted" style="width:130px;">Số phòng</td>
                            <td><strong th:text="${phong.soPhong}"></strong></td>
                        </tr>
                        <tr>
                            <td class="text-muted">Tòa nhà</td>
                            <td th:text="${phong.tenToaNha}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted">Diện tích</td>
                            <td th:text="${phong.dienTich != null ? phong.dienTich + ' m²' : '—'}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted">Giá thuê</td>
                            <td class="fw-600 text-success"
                                th:text="${#numbers.formatDecimal(phong.giaThueTheoMacDinh,0,'COMMA',0,'POINT')} + ' đ/tháng'"></td>
                        </tr>
                        <tr>
                            <td class="text-muted">Trạng thái</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${phong.trangThai != null and phong.trangThai.name() == 'TRONG'} ? 'bg-trang' :
                                                     (${phong.trangThai != null and phong.trangThai.name() == 'DANG_THUE'} ? 'bg-dang-thue' : 'bg-ngung')"
                                      th:text="${phong.trangThaiLabel}"></span>
                            </td>
                        </tr>
                        <tr th:if="${phong.moTa != null and !phong.moTa.isEmpty()}">
                            <td class="text-muted">Mô tả</td>
                            <td th:text="${phong.moTa}"></td>
                        </tr>
                    </table>
                </div>
                <!-- Quick links -->
                <div class="p-3 border-top d-flex flex-wrap gap-2">
                    <a th:href="@{/landlord/chi-so(phongId=${phong.id})}"
                       class="btn btn-sm btn-outline-secondary" style="border-radius:8px;font-size:.82rem;">
                        <i class="bi bi-lightning-charge me-1"></i>Chỉ số ĐN
                    </a>
                    <a th:href="@{/landlord/hop-dong(phongId=${phong.id})}"
                       class="btn btn-sm btn-outline-secondary" style="border-radius:8px;font-size:.82rem;">
                        <i class="bi bi-file-earmark-text me-1"></i>Hợp đồng
                    </a>

                    <form th:if="${phong.trangThai != null and phong.trangThai.name() == 'TRONG'}"
                          th:action="@{/landlord/phong/{id}/ngung-su-dung(id=${phong.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-outline-warning" style="border-radius:8px;font-size:.82rem;"
                                onclick="return confirm('Bạn có chắc muốn chuyển phòng này sang Ngừng sử dụng?')">
                            <i class="bi bi-pause-circle me-1"></i>Ngừng sử dụng
                        </button>
                    </form>

                    <form th:if="${phong.trangThai != null and phong.trangThai.name() == 'NGUNG_SU_DUNG'}"
                          th:action="@{/landlord/phong/{id}/mo-lai(id=${phong.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-outline-success" style="border-radius:8px;font-size:.82rem;"
                                onclick="return confirm('Mở lại phòng này để tiếp tục cho thuê (về trạng thái Trống)?')">
                            <i class="bi bi-play-circle me-1"></i>Mở lại phòng
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Thiet bi trong phong -->
        <div class="col-md-7">
            <div class="card-box">
                <div class="card-box-hd">
                    <h5><i class="bi bi-plug me-2" style="color:#6366f1"></i>Thiết bị trong phòng</h5>
                    <small class="text-muted"
                           th:text="${phong.danhSachThietBi != null ? phong.danhSachThietBi.size() : 0} + ' thiết bị'"></small>
                </div>

                <!-- Them thiet bi -->
                <div class="p-3 border-bottom">
                    <form th:action="@{/landlord/phong/{id}/them-thiet-bi(id=${phong.id})}" method="post"
                          class="d-flex gap-2 align-items-end">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="flex-grow-1">
                            <label class="form-label mb-1" style="font-size:.78rem;color:#64748b;">Thêm thiết bị vào phòng</label>
                            <select name="thietBiId" class="form-select form-select-sm" required>
                                <option value="">-- Chọn thiết bị --</option>
                                <option th:each="tb : ${danhSachThietBi}"
                                        th:value="${tb.id}"
                                        th:text="${tb.tenThietBi}">
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-accent btn-sm">
                            <i class="bi bi-plus-circle"></i> Thêm
                        </button>
                    </form>
                </div>

                <!-- Danh sach thiet bi hien co -->
                <div th:if="${phong.danhSachThietBi == null or phong.danhSachThietBi.isEmpty()}"
                     class="p-4 text-center text-muted">
                    <i class="bi bi-plug" style="font-size:2rem;opacity:.3"></i>
                    <p class="mt-2 mb-0" style="font-size:.875rem;">Phòng chưa có thiết bị nào.</p>
                </div>
                <div class="table-responsive" th:if="${phong.danhSachThietBi != null and !phong.danhSachThietBi.isEmpty()}">
                    <table class="table mb-0">
                        <thead>
                        <tr>
                            <th>Thiết bị</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- SỬA Ở ĐÂY: Đối tượng là ThietBi, gọi trực tiếp tb.tenThietBi và tb.id -->
                        <tr th:each="tb : ${phong.danhSachThietBi}">
                            <td>
                                <i class="bi bi-plug me-2" style="color:#6366f1;opacity:.6"></i>
                                <span th:text="${tb.tenThietBi}"></span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/landlord/phong/{phongId}/xoa-thiet-bi/{tbId}(phongId=${phong.id},tbId=${tb.id})}"
                                      method="post"
                                      onsubmit="return confirm('Xóa thiết bị này khỏi phòng?')"
                                      style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" style="border-radius:7px;">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
