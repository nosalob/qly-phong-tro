<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0" th:text="${id != null ? 'Sửa Tòa nhà' : 'Thêm Tòa nhà'}">Thêm Tòa nhà</h1>
        <a th:href="${id != null ? '/landlord/quan-ly?toaNhaId=' + id : '/landlord/quan-ly'}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
    </div>

    <div class="card-box p-4" style="max-width: 650px;">
        <form th:action="${id != null ? '/landlord/toa-nha/sua/' + id : '/landlord/toa-nha/them'}"
              th:object="${request}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="tenToaNha" class="form-label fw-semibold">Tên tòa nhà <span class="text-danger">*</span></label>
                <input type="text" id="tenToaNha" th:field="*{tenToaNha}" class="form-control"
                       placeholder="Ví dụ: Tòa A - Mễ Trì"
                       th:classappend="${#fields.hasErrors('tenToaNha')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('tenToaNha')}" th:errors="*{tenToaNha}"></div>
            </div>

            <div class="mb-3">
                <label for="diaChi" class="form-label fw-semibold">Địa chỉ <span class="text-danger">*</span></label>
                <input type="text" id="diaChi" th:field="*{diaChi}" class="form-control"
                       placeholder="Số nhà, đường, quận/huyện..."
                       th:classappend="${#fields.hasErrors('diaChi')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}"></div>
            </div>

            <div class="mb-4">
                <label for="trangThai" class="form-label fw-semibold">Trạng thái</label>
                <select id="trangThai" th:field="*{trangThai}" class="form-select">
                    <option th:each="tt : ${trangThaiList}"
                            th:value="${tt.value}"
                            th:text="${tt.label}">Hoạt động</option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-accent px-4">
                    <i class="bi bi-check2-circle me-1"></i>Lưu thông tin
                </button>
                <a th:href="${id != null ? '/landlord/quan-ly?toaNhaId=' + id : '/landlord/quan-ly'}" class="btn btn-light px-3">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
