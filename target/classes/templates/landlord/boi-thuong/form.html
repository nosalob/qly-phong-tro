<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Tạo yêu cầu bồi thường</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/boi-thuong}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="page-title mb-0">Tạo yêu cầu Bồi thường thiệt hại</h1>
    </div>

    <div class="card-box" style="max-width:700px;">
        <div class="card-box-hd">
            <h5><i class="bi bi-shield-plus me-2" style="color:#6366f1"></i>Thông tin bồi thường</h5>
        </div>
        <form th:action="@{/landlord/boi-thuong/them}" th:object="${request}" method="post" class="p-4">
            <div class="mb-3">
                <label class="form-label fw-500">Sự cố liên quan (nếu có)</label>
                <select th:field="*{suCoId}" class="form-select">
                    <option value="">-- Không gắn sự cố (bồi thường trực tiếp / phát hiện lúc trả phòng) --</option>
                    <option th:each="sc : ${danhSachSuCo}"
                            th:value="${sc.id}"
                            th:text="'Sự cố #' + ${sc.id} + ' - Phòng ' + ${sc.soPhong} + ' (' + ${sc.moTa} + ') - Trạng thái: ' + ${sc.trangThaiLabel} + (${sc.nguyenNhanLabel != null} ? ' - Nguyên nhân: ' + ${sc.nguyenNhanLabel} : '')"></option>
                </select>
                <div class="form-text text-muted" style="font-size:.78rem;">
                    Lưu ý: Chỉ sự cố đã hoàn thành và có nguyên nhân "Do người ở làm hỏng" mới được lập bồi thường.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-500">Hợp đồng phòng thuê <span class="text-danger">*</span></label>
                <select th:field="*{hopDongId}" class="form-select" th:classappend="${#fields.hasErrors('hopDongId')} ? 'is-invalid'">
                    <option value="">-- Chọn hợp đồng / phòng --</option>
                    <option th:each="hd : ${danhSachHopDong}"
                            th:value="${hd.id}"
                            th:text="'HĐ #' + ${hd.id} + ' - Phòng ' + ${hd.soPhong} + ' (' + ${hd.tenToaNha} + ')' + (${hd.daiDien != null} ? ' - ' + ${hd.daiDien.hoTen} : '')"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{hopDongId}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-500">Nguồn phát hiện <span class="text-danger">*</span></label>
                <select th:field="*{nguonPhatHien}" class="form-select" th:classappend="${#fields.hasErrors('nguonPhatHien')} ? 'is-invalid'">
                    <option th:each="ng : ${nguonPhatHienList}"
                            th:value="${ng.value}"
                            th:text="${ng.label} + (${ng.value == 0} ? ' (Thu trực tiếp trong lúc ở)' : ' (Tự động khấu trừ vào cọc khi kết thúc hợp đồng)')"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{nguonPhatHien}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-500">Mô tả thiệt hại <span class="text-danger">*</span></label>
                <textarea th:field="*{moTa}" class="form-control" rows="3"
                          placeholder="Mô tả cụ thể thiết bị hư hại hoặc lý do bồi thường..."
                          th:classappend="${#fields.hasErrors('moTa')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{moTa}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-500">Số tiền bồi thường (VNĐ) <span class="text-danger">*</span></label>
                    <input type="number" step="1000" th:field="*{soTien}" class="form-control"
                           placeholder="VD: 500000"
                           th:classappend="${#fields.hasErrors('soTien')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{soTien}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-500">Ngày ghi nhận</label>
                    <input type="date" th:field="*{ngayGhiNhan}" class="form-control">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a th:href="@{/landlord/boi-thuong}" class="btn btn-outline-secondary" style="border-radius:8px;">Hủy</a>
                <button type="submit" class="btn btn-accent">
                    <i class="bi bi-check-lg me-1"></i>Lưu yêu cầu bồi thường
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
