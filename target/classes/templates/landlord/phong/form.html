<!DOCTYPE html>
<!-- SỬA Ở ĐÂY 1: Bỏ th:replace="~{layout/base :: html-body}" -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Form Phòng</title></head>
<body>

<!-- SỬA Ở ĐÂY 2: Đổi <th:block th:fragment="pageContent"> thành <div th:fragment="content"> -->
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/phong}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;"><i class="bi bi-arrow-left"></i></a>
        <h1 class="page-title mb-0" th:text="${pageTitle}">Form Phòng</h1>
    </div>
    <div class="card-box" style="max-width:580px;">
        <div class="card-box-hd">
            <h5><i class="bi bi-door-open me-2" style="color:#6366f1"></i>Thông tin phòng</h5>
        </div>
        <div class="p-4">
            <form th:action="${id != null ? '/landlord/phong/sua/' + id : '/landlord/phong/them'}"
                  th:object="${request}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label fw-500">Tòa nhà <span class="text-danger">*</span></label>
                    <select th:field="*{toaNhaId}" class="form-select"
                            th:classappend="${#fields.hasErrors('toaNhaId')} ? 'is-invalid'">
                        <option value="">-- Chọn tòa nhà --</option>
                        <option th:each="tn : ${danhSachToaNha}"
                                th:value="${tn.id}"
                                th:text="${tn.tenToaNha}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{toaNhaId}"></div>
                </div>

                <div class="mb-3">
                    <label for="soPhong" class="form-label fw-500">Số phòng <span class="text-danger">*</span></label>
                    <input type="text" id="soPhong" th:field="*{soPhong}" class="form-control"
                           th:classappend="${#fields.hasErrors('soPhong')} ? 'is-invalid'"
                           placeholder="VD: 101, A1, ...">
                    <div class="invalid-feedback" th:errors="*{soPhong}"></div>
                    <div class="form-text">Số phòng phải duy nhất trong cùng tòa nhà.</div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label for="dienTich" class="form-label fw-500">Diện tích (m²)</label>
                        <input type="number" id="dienTich" th:field="*{dienTich}" class="form-control"
                               placeholder="VD: 20" step="0.1" min="0">
                    </div>
                    <div class="col-6">
                        <label for="giaThue" class="form-label fw-500">Giá thuê/tháng (đ) <span class="text-danger">*</span></label>
                        <input type="number" id="giaThue" th:field="*{giaThueTheoMacDinh}" class="form-control"
                               th:classappend="${#fields.hasErrors('giaThueTheoMacDinh')} ? 'is-invalid'"
                               placeholder="VD: 3000000" min="0">
                        <div class="invalid-feedback" th:errors="*{giaThueTheoMacDinh}"></div>
                    </div>
                </div>

                <div class="mb-3" th:if="${id == null}">
                    <label class="form-label fw-500">Trạng thái ban đầu</label>
                    <select th:field="*{trangThai}" class="form-select">
                        <option th:each="tt : ${trangThaiList}"
                                th:if="${tt.name() != 'DANG_THUE'}"
                                th:value="${tt.value}"
                                th:text="${tt.label}"></option>
                    </select>
                    <div class="form-text">Phòng mới chỉ có thể là Trống hoặc Ngừng sử dụng (không chọn Đang thuê).</div>
                </div>

                <div class="mb-4">
                    <label for="moTa" class="form-label fw-500">Mô tả</label>
                    <textarea id="moTa" th:field="*{moTa}" class="form-control" rows="2"
                              placeholder="Phòng có ban công, WC riêng, ..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="${id != null ? 'Cập nhật' : 'Thêm mới'}">Lưu</span>
                    </button>
                    <a th:href="@{/landlord/phong}" class="btn btn-outline-secondary" style="border-radius:8px;">Hủy</a>
                </div>
            </form>
        </div>
    </div>
    <!-- SỬA Ở ĐÂY 3: Đóng </div> thay cho </th:block> -->
</div>
</body>
</html>
