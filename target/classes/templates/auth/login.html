<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý Phòng Trọ</title>
    <meta name="description" content="Đăng nhập vào hệ thống quản lý phòng trọ">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background circles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .15;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            width: 500px;
            height: 500px;
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, #6366f1, transparent);
        }

        body::after {
            width: 400px;
            height: 400px;
            bottom: -80px;
            right: -80px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            animation-delay: -4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, .95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
            position: relative;
            z-index: 10;
            animation: slideUp .5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, .4);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #64748b;
            font-size: .875rem;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: .85rem;
            font-weight: 500;
            color: #374151;
        }

        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: .9rem;
            transition: all .2s;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
        }

        .input-group .form-control {
            border-radius: 10px !important;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: .95rem;
            transition: all .2s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, .4);
            color: #fff;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: .875rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success-login {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: .875rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hint-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 20px;
            font-size: .78rem;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-logo"><i class="bi bi-house-fill"></i></div>
        <h1 class="text-center">Quản lý Phòng Trọ</h1>
        <p class="subtitle text-center">Đăng nhập để tiếp tục</p>

        <!-- Error / Logout messages -->
        <div th:if="${param.error}" class="alert-error mb-3">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        <div th:if="${param.logout}" class="alert-success-login mb-3">
            <i class="bi bi-check-circle-fill"></i>
            Bạn đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"
                        style="background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:10px 0 0 10px;">
                        <i class="bi bi-person" style="color:#6366f1"></i>
                    </span>
                    <input type="text" id="username" name="username" class="form-control border-start-0"
                        placeholder="Nhập username" required autocomplete="username"
                        style="border-left:none; border-radius:0 10px 10px 0;">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"
                        style="background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:10px 0 0 10px;">
                        <i class="bi bi-lock" style="color:#6366f1"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control border-start-0"
                        placeholder="Nhập mật khẩu" required autocomplete="current-password"
                        style="border-left:none; border-radius:0 10px 10px 0;">
                </div>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" id="btn-login" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
            </button>
        </form>


    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
