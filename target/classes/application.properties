# =====================================================
# APPLICATION
# =====================================================

spring.application.name=quan-ly-phong-tro
server.port=8080

# =====================================================
# DATASOURCE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_phong_tro?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Son123@@##
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

# =====================================================
# THYMELEAF
# =====================================================

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads
app.admin.initial-password=admin@123

# =====================================================
# LOGGING
# =====================================================

logging.level.com.qlytro=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF